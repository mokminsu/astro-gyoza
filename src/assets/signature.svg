<svg viewBox="295 230 655 170" height="50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* 선이 그려지는 애니메이션 설정 */
    .draw-path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawSignature 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    
    @keyframes drawSignature {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* 필기체처럼 획 순서대로 딜레이 부여 */
    .draw-path:nth-child(1) { animation-delay: 0s; }
    .draw-path:nth-child(2) { animation-delay: 0.3s; }
    .draw-path:nth-child(3) { animation-delay: 0.8s; }
    .draw-path:nth-child(4) { animation-delay: 1.1s; }
    .draw-path:nth-child(5) { animation-delay: 1.6s; }
    .draw-path:nth-child(6) { animation-delay: 1.9s; }
    .draw-path:nth-child(7) { animation-delay: 2.3s; }
  </style>

  <g style="fill: none !important; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round;">
    <!-- B 세로 획 -->
    <path class="draw-path" pathLength="1" d="M 326 255 L 310 383" style="fill: none !important; stroke-width: 6px;" />
    <!-- B 곡선 -->
    <path class="draw-path" pathLength="1" d="M 318 252 C 348 236, 381 247, 375 266 C 363 277, 342 291, 335 301 C 363 305, 401 319, 395 337 C 380 348, 343 372, 303 386" style="fill: none !important; stroke-width: 6px;" />
    <!-- I 흘림선 -->
    <path class="draw-path" pathLength="1" d="M 484 252 L 446 389" style="fill: none !important; stroke-width: 6px;" />
    <!-- G -->
    <path class="draw-path" pathLength="1" d="M 584 257 C 550 267, 505 328, 515 352 C 535 355, 577 330, 578 316 L 614 307" style="fill: none !important; stroke-width: 6px;" />
    <!-- P 세로 내림선 -->
    <path class="draw-path" pathLength="1" d="M 663 261 L 628 359" style="fill: none !important; stroke-width: 6px;" />
    <!-- P 둥근 머리 -->
    <path class="draw-path" pathLength="1" d="M 659 255 C 687 238, 721 251, 716 266 C 705 277, 680 293, 661 303" style="fill: none !important; stroke-width: 6px;" />
    <!-- lan 필기체 꼬리 -->
    <path class="draw-path" pathLength="1" d="M 753 251 L 719 346 C 755 335, 755 335, 759 342 C 781 336, 810 318, 804 337 C 825 338, 870 314, 865 335 C 885 332, 936 320, 938 338" style="fill: none !important; stroke-width: 6px;" />
  </g>
</svg>
